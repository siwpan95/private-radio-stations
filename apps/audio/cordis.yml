# Private Radio Stations — Cordis plugin registry & configuration
# P6 行式配置：每行 { id, module?, config?, disabled?, hot? }，按声明顺序应用。

plugins:
  # Foundation service: resolves paths, port, ffmpeg binary, HLS/mount config.
  # MUST stay first so ctx.config is available to the services below.
  - id: config
    config:
      port: !!js "Number(process.env.PORT) || 8000"
      host: 0.0.0.0
      defaultBitrate: 128
      chunkSize: 4096
      transcodeMounts: [64, 320]
      hls:
        enabled: true
        dir: hls
        segmentSec: 4
        listSize: 6
        deleteThreshold: 3
        variants: [128, 64]
      ffmpegDir: ffmpeg
      presetsFile: presets.json

  # File logging + in-memory error ring (impl from @relay/core, size-capped).
  - id: logfile
    config:
      file: data/logs/radio.log

  # Runtime invariants (HARNESS P5): event pairing / data conservation assertions.
  - id: invariants

  # Layered settings service (P9).
  - id: settings

  # Relay state machine (idle <-> relay) with multi-source failover.
  - id: station

  # Proxies the active source and spawns ffmpeg for per-client transcode mounts.
  - id: streamer

  # HLS segment slicing via ffmpeg, driven by relay lifecycle events.
  - id: hls

  # Radio-Browser.info global station search.
  - id: browse

  # presets.json read/write (dedupe + atomic write).
  - id: presets

  # musickit 随机渲染音源（S4 自 python musickit_source.py 迁移：渲染子进程队列+状态+API）
  - id: musickit
    config:
      root: G:\\music\\musickit
      python: F:\\Python314\\python.exe
      channel: random
      bars: 32
      format: mp3
      maxTracks: 5
      fusion: false
      releaseSafe: false
      timeoutSec: 600
      cacheDir: G:\\music\\musickit\\radio\\render_cache
      keep: 20
      queueDepth: 3
      maxFails: 5

  # HTTP API + control-panel UI.
  - id: web
