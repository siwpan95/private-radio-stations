# Local Video Relay — Cordis plugin registry & configuration
# 与 apps/audio 同源的转播站架构（Node.js + Cordis + yml 插件式加载，公共部分在 packages/core）。
# P6 行式配置：每行 { id, module?, config?, disabled?, hot? }，按声明顺序应用；
# hot: true 的行支持热加载（见 docs/ROADMAP_CONFIG.md P8）。

plugins:
  # 基础配置：面板端口 / 转播路径名 / MediaMTX 与 ffmpeg 位置。
  # 必须保持第一个，后面的服务都依赖 ctx.config。
  - id: config
    config:
      port: !!js "Number(process.env.PORT) || 8100"   # 控制面板端口（!!js 表达式，可被环境变量覆盖）
      host: 0.0.0.0
      pathName: live          # MediaMTX 中的转播路径名（rtsp://IP:8554/live 等）
      transcode: false        # 默认不转码（-c copy）；HEVC/AV1 源看不了时改成 true 转 H.264
      rtspPort: 8554          # 与 mediamtx.yml 保持一致
      hlsPort: 8888
      webrtcPort: 8889
      record:
        enabled: false        # 开始转播时默认是否同时录像（面板上可单独开关）
        dir: recordings
      mediamtx:
        dir: mediamtx         # mediamtx.exe 所在目录（相对于项目根）
        yml: mediamtx.yml
        apiAddress: 127.0.0.1:9997
      ffmpegDir: ffmpeg
      presetsFile: presets.json
      channelsDir: playlists   # IPTV m3u 频道库目录
      liveDir: src/live        # real-url 平台解析器目录
      # 解析器使用的 Python。
      # 用 !!js 在运行时推导【项目自带 venv】的绝对路径，不写死盘符/仓库位置
      # （避免项目被移动或换盘后解析器全部失效，报「解析器无有效输出」）。
      # 注意 !!js 作用域里的 root 是本 yml 所在目录（apps/video），
      # 故需上溯两级到仓库根；可用环境变量 RESOLVER_PYTHON 覆盖。
      pythonCmd: !!js "process.env.RESOLVER_PYTHON || path.join(root, '..', '..', '.venv', 'Scripts', 'python.exe')"

      # 卫星影像（NASA GIBS 公有领域数据，免费免注册）。
      # 关键约束（本机实测，见 docs/SATELLITE_SOURCES.md）：
      #   - GIBS 只提供静态瓦片，**没有现成的视频流**，必须离线渲染成 mp4；
      #   - 本机**无可用硬件编码**（nvenc/qsv/amf 全部实测失败），软件编码
      #     转码速度仅 0.03x~0.30x，**无法做到实时**，故不能做成直播频道；
      #   - 因此采用「npm run satellite 离线生成 mp4 → 当点播源转播」，
      #     复用现有 -c copy 路径，无需改动 streamer.js。
      # 生成：npm run satellite -- --days 5
      satellite:
        enabled: true
        dir: satellite        # 成品目录（相对 apps/video）
        source: modis         # modis | viirs | weld
        zoom: 3               # 0..9，越大越清晰越耗流量
        days: 5               # 多日合成，减轻 MODIS 条带缝隙

  # 文件日志 + 内存错误环（实现来自 @relay/core，超限截断）。
  - id: logfile
    config:
      file: data/logs/stream.log

  # 运行时不变量（HARNESS P5）：事件配对 / 数据守恒断言。
  - id: invariants

  # 分层设置服务（P9：schema 默认 → base → 用户文档三层合并）。
  - id: settings

  # MediaMTX 进程托管：启动/退出守护 + 健康探测（:9997 控制 API）。
  - id: mediamtx

  # 转播状态机（idle <-> relay）+ 多源 failover + 失败自动重试。
  - id: station

  # ffmpeg 拉远端源 -> 推 RTSP 给 MediaMTX（-c copy 或转码 H.264）。
  - id: streamer

  # 录像：从本地 RTSP 拉流落盘（recordings/*.ts），随转播启停、可独立开关。
  - id: recorder

  # presets.json 读写（去重 + 原子写）。
  - id: presets

  # IPTV m3u 频道库（playlists/*.m3u8，同频道多源合并为 failover 备用源）。
  - id: channels

  # 直播平台真实流地址解析（src/live/，real-url 解析器，GPL-2.0）。
  - id: resolver

  # 桌面播放器快捷入口：前台拉起 PluginPlayer（external/pluginplayer/dist，整目录）并用控制通道驱动。
  # exe 解析顺序见 src/plugins/launcher.js（配置 > PP_EXE > 本仓 external/ → 源码仓 C:\pluginplayer-main\dist）。
  # 与 radio 应用完全独立（独立 RPC 端口 7921）。
  - id: launcher
    config:
      launchPort: 7921

  # HTTP API + 控制面板 UI。
  - id: web
